# ===========================================================================
# İnsan etiketləri — hakimin (Cohen kappa) yoxlanması üçün.
#
# NİYƏ BU FAYL ƏL İLƏ DOLDURULUR
#   Kappa insan qərarı ilə hakim qərarı arasındakı razılığı ölçür. Etiketləri
#   modelə yazdırmaq ölçünü mənasız edərdi: model öz-özü ilə razılaşır.
#   Bu fayl layihə müəllifinin öz işidir.
#
# NİYƏ HAKİMİN BALI BURADA GÖSTƏRİLMİR
#   Etiketçi hakimin balını görsəydi, ona uyğunlaşardı (anchoring) və kappa
#   həqiqi razılığı deyil, təsirlənməni ölçərdi. Balı yalnız etiketləri
#   yazıb bitirdikdən SONRA `python -m eval.cli judge-bias` ilə müqayisə edin.
#
# ŞKALA (hakimlə EYNİ ankerlər — fərqli şkala kappanı mənasız edər):
#   3 = Tam düzgün: bütün iddialar mənbədə var, meyar tam ödənilib.
#   2 = Əsasən düzgün: əsas iddia doğrudur, kiçik natamamlıq var.
#   1 = Qismən: bir doğru element var, əsaslı çatışmazlıq var.
#   0 = Yanlış: mənbə ilə ziddiyyət təşkil edir və ya meyarı ödəmir.
#
# NECƏ DOLDURULUR
#   Hər case blokunun sonunda belə bir sətir var:
#
#       # dev_multihop_mtls_cache: 0
#
#   Həmin sətirdə `# ` (diyez və bir boşluq) silinir və `0` yerinə balınız
#   yazılır. Girinti (iki boşluq) OLDUĞU KİMİ qalmalıdır — açar `labels:`
#   altında olmalıdır, yoxsa oxunmaz:
#
#         dev_multihop_mtls_cache: 2
#
#   Bütün 9-u doldurmaq məcburi deyil; doldurduqlarınız ölçülür, qalanları
#   isə `judge-bias` çıxışında «etiketlənməyib» kimi sadalanır.
#
# BİTİRDİKDƏN SONRA
#   python -m eval.cli judge-bias
#   Çıxan kappa və n dəyərlərini `logs/judge_bias.md`-in 3-cü bölməsinə yazın.
# ===========================================================================

# ---------------------------------------------------------------------------
# MƏNBƏ RUN-LAR — MAŞIN ÜÇÜNDÜR, ƏL İLƏ DƏYİŞMƏYİN.
#
# Hər etiket MƏHZ bu run-ın MƏHZ bu təkrarındakı cavaba aiddir. Bu blok
# olmasa, etiket başqa run-ın (məsələn variant run-ının) fərqli cavabı ilə
# müqayisə oluna bilərdi — yəni insanın heç görmədiyi mətnlə. Aşağıdakı
# dəyərlər cavab mətnini `runs/*/observations.jsonl` ilə tutuşdurmaqla
# çıxarılıb, uydurulmayıb.
#
# Qeyd: 9 cavabdan 8-i baseline və variant run-larında EYNİDİR (holdout-da
# hər üç təkrarda da eyni). Yalnız `dev_open_incident_s1` variantda dəyişir —
# məhz variantın düzəltdiyi case odur. Buna görə lövbər baseline seçilib:
# etiketlənən mətnin hansı run-a aid olduğu birmənalı olsun.
# ---------------------------------------------------------------------------

sources:
  dev_multihop_mtls_cache:      {run_id: 20260810T082136Z-dev-baseline, repeat: 1}
  dev_false_premise_free_cache: {run_id: 20260810T082136Z-dev-baseline, repeat: 1}
  dev_ambiguous_limit:          {run_id: 20260810T082136Z-dev-baseline, repeat: 1}
  dev_lang_mixed_backup:        {run_id: 20260810T082136Z-dev-baseline, repeat: 1}
  dev_open_incident_s1:         {run_id: 20260810T082136Z-dev-baseline, repeat: 1}
  hold_multihop_sla_vs_incident: {run_id: 20260810T082912Z-holdout-baseline, repeat: 1}
  hold_false_premise_dord_gun:   {run_id: 20260810T082912Z-holdout-baseline, repeat: 1}
  hold_ambiguous_hesabat:        {run_id: 20260810T082912Z-holdout-baseline, repeat: 1}
  hold_injection_cedvel:         {run_id: 20260810T082912Z-holdout-baseline, repeat: 1}

