# Bütün suite AÇARSIZ və ŞƏBƏKƏSİZ işləyir — burada heç bir secret yoxdur.
# Bu qəsdəndir: xarici sərhədlər inyeksiya olunduğu üçün CI lokal mühitlə
# eyni şəraitdədir və "lokalda keçir, CI-də keçmir" sinfi mövcud deyil.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodule lazımdır: test dəsti injection markerlərini SUT-un
          # HƏQİQİ system prompt-una qarşı yoxlayır (uydurma marker heç nə
          # sübut etməzdi).
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Asılılıqlar
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testlər
        run: pytest -q

      - name: CLI köməyi işləyir
        run: python -m eval.cli --help

      # ÜÇ dizayn qərarı, hər biri real yalan-nəticəni bağlayır:
      #
      # 1. Nümunə açarın FORMASINI axtarır (prefiks + uzun təsadüfi quyruq),
      #    sadəcə prefiksi yox. Prefiksi axtaran nümunə bu faylın ÖZÜNDƏ də
      #    var və yoxlama həmişə uğursuz olardı — daimi yalan pozitiv
      #    yoxlamanı faydasız edir, çünki hamı onu iqnor etməyi öyrənir.
      #
      # 2. `git ls-files` ilə YALNIZ repoya düşəcək fayllar skan olunur,
      #    `grep -r .` ilə iş qovluğu yox. Səbəb: bəzi grep tətbiqləri
      #    (məsələn ugrep) rekursiv rejimdə gizli faylları ATLAYIR və
      #    `.env` səssizcə yoxlanmamış qalır. Sual «iş qovluğunda açar
      #    varmı» deyil, «GitHub-a açar düşəcəkmi» olduğu üçün doğru
      #    siyahı onsuz da git-in siyahısıdır.
      #
      # 3. Exit koduna güvənilmir: `xargs` girişi bir neçə `grep`
      #    çağırışına bölür və yalnız SONUNCUNUN statusunu qaytarır —
      #    ilk partiyada tapılan açar itə bilər. Çıxışın boş olub-olmaması
      #    yoxlanılır.
      - name: Repoya düşəcək fayllarda açar yoxdur
        run: |
          hits=$(git ls-files --cached --others --exclude-standard -z \
                 | xargs -0 grep -lE \
                     -e 'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{40,}' \
                     -e 'sk-proj-[A-Za-z0-9_-]{40,}' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Canlı açara oxşayan sətir tapıldı:"; echo "$hits"; exit 1
          fi
          echo "Açar tapılmadı."

      - name: .env izlənmir
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env git tərəfindən izlənir — .gitignore pozulub."; exit 1
          fi
          echo ".env izlənmir."
